name: Build Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      source_run:
        description: Actions run ID whose built installer should be uploaded to Gitee
        required: true
        type: string
      gitee_runner:
        description: Optional label of a dedicated runner for this Gitee retry
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.source_run || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      gitee_repo: ${{ steps.metadata.outputs.gitee_repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag and notes
        id: metadata
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; from updater import parse_version; parse_version(APP_VERSION); print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Invalid version" }
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match version.py: v$version" }
          $notes = "releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing public release notes: $notes" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          $giteeRepo = python -c "from updater import GITEE_RELEASE_REPO; print(GITEE_RELEASE_REPO)"
          if ($giteeRepo -and $giteeRepo -cnotmatch '^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$') { throw "Invalid Gitee release repository" }
          "gitee_repo=$giteeRepo" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-6.7.4.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $setup
          $expected = "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Inno Setup checksum mismatch" }
          $folder = Join-Path $env:RUNNER_TEMP "InnoSetup6"
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=`"$folder`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed" }
          "INNO_COMPILER=$folder\ISCC.exe" >> $env:GITHUB_ENV
      - name: Test update and data lifecycle
        shell: pwsh
        run: |
          foreach ($suite in @('test_updater.py', 'test_storage.py', 'test_app_lifecycle.py', 'test_update_ui.py')) {
            python -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $suite" }
          }
      - name: Build installer and checksums
        shell: pwsh
        run: ./scripts/package.ps1 -Installer -Iscc $env:INNO_COMPILER
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z-note-${{ env.RELEASE_VERSION }}
          path: |
            dist/z-note-setup-${{ env.RELEASE_VERSION }}.exe
            dist/SHA256SUMS
          if-no-files-found: error

  github-draft:
    needs: build
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: z-note-${{ needs.build.outputs.version }}
          path: dist
      - name: Create draft in public release repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: TrevorZsl/z-note-releases
        run: |
          if (-not $env:GH_TOKEN) { throw "Configure the RELEASE_TOKEN Actions secret first" }
          $tag = "v$env:RELEASE_VERSION"
          # No --clobber: a published release or an existing draft is never overwritten.
          gh release create $tag "dist/z-note-setup-$env:RELEASE_VERSION.exe" "dist/SHA256SUMS" --repo $env:RELEASE_REPO --draft --title "z-note $env:RELEASE_VERSION" --notes-file "releases/$env:RELEASE_VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw "Draft upload failed; inspect the target release before retrying" }

  gitee-preview:
    needs: build
    if: ${{ !cancelled() && ((needs.build.result == 'success' && needs.build.outputs.gitee_repo != '') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ inputs.gitee_runner || vars.GITEE_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      GITEE_RELEASE_REPO: ${{ needs.build.outputs.gitee_repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the original release build for a Gitee retry
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          if ($env:SOURCE_RUN -cnotmatch '^[0-9]+$') { throw "Invalid Actions run ID" }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.path -cnotmatch '^\.github/workflows/release\.yml(@.+)?$' -or
              $run.event -cne 'push' -or $run.status -cne 'completed' -or
              $run.head_branch -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Select a completed tag-triggered Windows release run"
          }
          "RELEASE_VERSION=$($run.head_branch.Substring(1))" >> $env:GITHUB_ENV
          $giteeRepo = python -c "from updater import GITEE_RELEASE_REPO; print(GITEE_RELEASE_REPO)"
          if ($LASTEXITCODE -ne 0 -or $giteeRepo -cnotmatch '^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$') { throw "Invalid Gitee release repository" }
          "GITEE_RELEASE_REPO=$giteeRepo" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: z-note-${{ env.RELEASE_VERSION }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || github.run_id }}
      - name: Create Gitee preview and upload the same installer
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if (-not $env:GITEE_TOKEN) { throw "Configure the GITEE_TOKEN Actions secret first" }
          $env:no_proxy = 'gitee.com,foruda.gitee.com'
          $tag = "v$env:RELEASE_VERSION"
          $installer = Get-Item -LiteralPath "dist/z-note-setup-$env:RELEASE_VERSION.exe"
          $sums = Get-Item -LiteralPath 'dist/SHA256SUMS'
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -Raw -LiteralPath $sums.FullName).TrimEnd() -cne "$hash  $($installer.Name)") {
            throw "Build artifact checksum mismatch"
          }
          if ($installer.Length -gt 100MB) { throw "Installer exceeds Gitee's 100 MB attachment limit" }
          $repo = "https://gitee.com/api/v5/repos/$env:GITEE_RELEASE_REPO"
          $auth = @{ Authorization = "Bearer $env:GITEE_TOKEN" }
          try {
            $target = Invoke-RestMethod -Uri $repo -Headers $auth -NoProxy -MaximumRedirection 0 -TimeoutSec 60
            if (-not $target.default_branch -or $target.private -ne $false) { throw "Gitee requires an initialized public repository" }
            $metadata = @{
              tag_name = $tag
              name = "z-note $env:RELEASE_VERSION"
              body = Get-Content -Raw -Encoding UTF8 -LiteralPath "releases/$env:RELEASE_VERSION.md"
              target_commitish = $target.default_branch
              prerelease = $true
            } | ConvertTo-Json -Compress
            $release = $null
            try {
              $release = Invoke-RestMethod -Uri "$repo/releases/tags/$tag" -Headers $auth -NoProxy -MaximumRedirection 0 -TimeoutSec 30
            } catch {
              if ($_.Exception.Response.StatusCode -ne 404) { throw }
            }
            if (-not $release) {
              $release = Invoke-RestMethod -Method Post -Uri "$repo/releases" -Headers $auth `
                -ContentType 'application/json; charset=utf-8' -Body $metadata -NoProxy -MaximumRedirection 0 -TimeoutSec 60
            }
            if (-not $release.id -or $release.tag_name -cne $tag -or $release.prerelease -ne $true) {
              throw "Gitee did not return the expected preview release"
            }
            $attachments = "$repo/releases/$($release.id)/attach_files"
            $existing = Invoke-RestMethod -Uri $attachments -Headers $auth -NoProxy -MaximumRedirection 0 -TimeoutSec 30
            $downloads = "https://gitee.com/$env:GITEE_RELEASE_REPO/releases/download/$tag"
            foreach ($file in @($sums, $installer)) {
              $matches = @($existing | Where-Object name -CEQ $file.Name)
              if ($matches.Count) {
                if ($matches.Count -ne 1 -or $matches[0].size -ne $file.Length) { throw "Existing Gitee attachment metadata mismatch: $($file.Name)" }
                $expected = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $actual = python -c 'import hashlib,sys; from updater import _open; stream = _open(sys.argv[1]); print(hashlib.file_digest(stream, "sha256").hexdigest()); stream.close()' "$downloads/$($file.Name)"
                if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw "Existing Gitee attachment checksum mismatch: $($file.Name)" }
                Write-Host "Reusing verified Gitee attachment $($file.Name)"
                continue
              }
              Write-Host "Uploading $($file.Name) ($($file.Length) bytes) to Gitee"
              $response = curl --noproxy gitee.com --silent --show-error --fail --connect-timeout 20 --max-time 600 --speed-time 45 --speed-limit 1024 `
                --write-out '%{stderr}Gitee HTTP %{http_code}, uploaded %{size_upload} bytes, total %{time_total}s\n' `
                --form-string "access_token=$env:GITEE_TOKEN" --form "file=@$($file.FullName)" $attachments
              if ($LASTEXITCODE -ne 0) { throw "Gitee upload failed for $($file.Name) (curl $LASTEXITCODE)" }
              $asset = $response | ConvertFrom-Json
              if ($asset.name -cne $file.Name -or $asset.size -ne $file.Length) { throw "Gitee attachment metadata mismatch" }
            }
          } catch {
            $code = $_.Exception.Response.StatusCode
            if ($code) { throw "Gitee Release API failed (HTTP $([int]$code)). Check the preview before retrying." }
            throw
          }
          "Gitee preview: https://gitee.com/$env:GITEE_RELEASE_REPO/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
